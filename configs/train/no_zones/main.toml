# Main no-zones ablation config.
#
# Controlled ablation, NOT a re-tuned model: every [train] key below is
# copied verbatim from configs/train/graph/main.toml (the run mqvs9uqo,
# itself the product of W&B sweep l2hn48fy) so this run differs from
# graph-main ONLY in architecture. The no_zones variant
# (NoZonesSpottingModel) keeps the HGT graph over player nodes -- including
# the radius edge type and its degree counts -- but removes the
# heterogeneous zone nodes entirely.
#
# Keys NOT carried over because this variant doesn't accept them at all
# (see pcspot/train/cli_common.py:_KNOWN_TRAIN_KEYS and
# scripts/no_zones/train.py:_EXTRA_TRAIN_KEYS = {use_radius_edges, radius}):
#   use_zone_nodes, zone_grid
# use_radius_edges / radius ARE carried over (this variant keeps player-
# player radius edges); use_jersey / use_goal_distances likewise kept.
#
# See docs/zone_nodes.md "Model variants" table:
#   graph (mqvs9uqo)  -> PlayerCentricSpottingModel, full HGT + zone nodes
#   no_zones (this)   -> NoZonesSpottingModel, player-only HGT
#   no_graph          -> NoGraphSpottingModel, no HGT at all
#
# Capacity (hidden_dim=512, visual_dim=384) is held constant on purpose --
# the ablation isolates "zone nodes vs. no zone nodes", not "graph vs.
# smaller model". no_zones has less compute per step than graph (no zone
# SUM/diffusion update), so VRAM at batch_size=16/hidden_dim=512 should
# have MORE headroom than graph-main's ~25.6/32 GB. Same dataloader
# settings apply (the run was likely input-bound on cache reads).
#
#   python scripts/no_zones/train.py \
#       --config config.toml \
#       --train-config configs/train/no_zones/main.toml \
#       --splits data/splits.json \
#       --output-dir checkpoints/no_zones/main \
#       --visual-cache <visual_features_root> \
#       --target-cache .cache/calf \
#       --keep-best-metric val/map_joint \
#       --device cuda:0 \
#       --wandb-run-name no_zones-main

[train]
epochs = 24
batch_size = 16
learning_rate = 1.44e-4
weight_decay = 5.2e-5
warmup_steps = 100
grad_clip = 3.0
window_size = 128
stride = 96

# Same dims as graph/main.toml -- capacity held constant for the ablation.
hidden_dim = 512
num_mstcn_stages = 4
num_mstcn_layers = 10
visual_dim = 384
visual_backbone = "dinov2_vits14"

# Player-graph extensions kept (same rest-of-graph as graph/main.toml);
# only the zone-node channel is removed. No zone/grid knobs here -- this
# variant doesn't accept them at all.
use_jersey = true
use_goal_distances = true
use_radius_edges = true
radius = 0.15

# Same event-centered sampling as graph/main.toml.
sampler = "mixed"
positive_ratio = 0.57
event_weighting = "linear"
sampler_seed = 1

# Single GPU; same as graph/main.toml.
grad_accum_steps = 1
amp = true
amp_dtype = "bf16"

# Same dataloader settings as graph/main.toml.
num_workers = 16
prefetch_factor = 4
persistent_workers = true

seed = 42

[validation]
validation_split = "val"
decode_threshold = 0.5
nms_radius = 12
nms_mode = "per_player_class"
metric_tolerances = [3, 12, 25]

[wandb]
enabled = true
project = "pcspot-scripts"
tags = ["pcbas", "no_zones", "main", "ablation", "matches-graph-main"]
mode = "online"
log_artifacts = true
